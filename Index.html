<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wedding Scheduler</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#1f2937;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}
.login-box h1{
  margin:0 0 8px;
  text-align:center;
}
.login-box p{
  text-align:center;
  color:#6b7280;
}
.field{
  margin-bottom:15px;
}
.field label{
  display:block;
  margin-bottom:6px;
  font-weight:600;
}
.field input,
.field select,
.field textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #d1d5db;
  border-radius:9px;
  outline:none;
}
.field textarea{
  min-height:90px;
  resize:vertical;
}
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#6366f1;
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  font-weight:600;
}
.btn-primary{
  background:#4f46e5;
  color:white;
}
.btn-danger{
  background:#dc2626;
  color:white;
}
.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}
.full{width:100%}

#app{
  display:none;
  min-height:100vh;
}
header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:10;
}
.brand{
  font-size:22px;
  font-weight:800;
}
.header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:22px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}
.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}
.stat small{
  color:#6b7280;
}
.stat strong{
  display:block;
  font-size:28px;
  margin-top:5px;
}

.toolbar{
  background:#fff;
  padding:15px;
  border-radius:14px;
  display:flex;
  gap:10px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.toolbar input,
.toolbar select{
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:9px;
  min-width:180px;
}
.toolbar .spacer{
  flex:1;
}

.events{
  display:grid;
  gap:12px;
}
.event{
  background:#fff;
  border-radius:14px;
  padding:17px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}
.event-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}
.event-title{
  font-size:18px;
  font-weight:700;
}
.event-date{
  color:#4f46e5;
  font-weight:700;
  margin-top:4px;
}
.event-info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px 20px;
  margin-top:12px;
  color:#4b5563;
}
.event-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#eef2ff;
  color:#4338ca;
  font-size:12px;
  font-weight:700;
}

.empty{
  background:#fff;
  padding:40px;
  text-align:center;
  border-radius:14px;
  color:#6b7280;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:50;
  padding:20px;
  overflow:auto;
}
.modal-box{
  max-width:700px;
  margin:30px auto;
  background:#fff;
  border-radius:16px;
  padding:22px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}
.modal-head h2{
  margin:0;
}
.close{
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 15px;
}
.form-full{
  grid-column:1/-1;
}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:10px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#6b7280;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr;
  }
  .event-info{
    grid-template-columns:1fr;
  }
  .form-grid{
    grid-template-columns:1fr;
  }
  .form-full{
    grid-column:auto;
  }
  header{
    align-items:flex-start;
    flex-direction:column;
  }
  .header-right{
    width:100%;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <h1>💍 Wedding Scheduler</h1>
    <p>Login to continue</p>

    <div class="field">
      <label>Email / Login ID</label>
      <input id="loginEmail" type="email" placeholder="Enter your email">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Enter password">
    </div>

    <button class="btn btn-primary full" onclick="login()">Login</button>

    <p id="loginError" style="color:#dc2626;margin-top:12px;"></p>
  </div>
</div>


<!-- APP -->
<div id="app">

<header>
  <div class="brand">💍 Wedding Scheduler</div>

  <div class="header-right">
    <span id="userEmail" style="color:#6b7280;font-size:14px;"></span>
    <button class="btn btn-secondary" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">

  <!-- STATS -->
  <div class="stats">

    <div class="stat">
      <small>Total Events</small>
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat">
      <small>Upcoming</small>
      <strong id="upcomingCount">0</strong>
    </div>

    <div class="stat">
      <small>Today</small>
      <strong id="todayCount">0</strong>
    </div>

  </div>


  <!-- TOOLBAR -->
  <div class="toolbar">

    <input
      id="search"
      type="text"
      placeholder="Search customer, phone, venue..."
      oninput="render()"
    >

    <select id="filter" onchange="render()">
      <option value="all">All Events</option>
      <option value="upcoming">Upcoming</option>
      <option value="today">Today</option>
      <option value="past">Past</option>
    </select>

    <div class="spacer"></div>

    <button class="btn btn-primary" onclick="openModal()">
      + New Event
    </button>

  </div>


  <!-- EVENTS -->
  <div id="events" class="events">
    <div class="loading">Loading...</div>
  </div>

</div>
</div>


<!-- MODAL -->
<div id="modal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2 id="modalTitle">New Wedding Event</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <input type="hidden" id="editId">

    <div class="form-grid">

      <div class="field">
        <label>Wedding Date *</label>
        <input id="date" type="date">
      </div>

      <div class="field">
        <label>Time</label>
        <input id="time" type="time">
      </div>

      <div class="field">
        <label>Event Type *</label>
        <select id="type">
          <option value="">Select Event Type</option>
          <option>Wedding</option>
          <option>Barat</option>
          <option>Walima</option>
          <option>Mehndi</option>
          <option>Engagement</option>
          <option>Nikkah</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label>Assigned Team</label>
        <input id="team" type="text" placeholder="e.g. Team A">
      </div>

      <div class="field">
        <label>Venue</label>
        <input id="venue" type="text" placeholder="Wedding venue">
      </div>

      <div class="field">
        <label>Customer Name *</label>
        <input id="customer" type="text" placeholder="Customer name">
      </div>

      <div class="field">
        <label>Customer Phone</label>
        <input id="phone" type="text" placeholder="03xxxxxxxxx">
      </div>

      <div class="field">
        <label>Package</label>
        <input id="package" type="text" placeholder="Package name">
      </div>

      <div class="field form-full">
        <label>Notes</label>
        <textarea id="notes" placeholder="Additional notes"></textarea>
      </div>

    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="save()">Save Event</button>
    </div>

  </div>
</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

let cache = [];
let currentUser = null;


/* ---------------------------
   SUPABASE
---------------------------- */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* ---------------------------
   HELPERS
---------------------------- */

function $(id){
  return document.getElementById(id);
}

function esc(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function todayString(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function formatDate(date){
  if(!date) return '';

  const d = new Date(date + 'T00:00:00');

  return d.toLocaleDateString('en-GB',{
    day:'2-digit',
    month:'short',
    year:'numeric'
  });
}


/* ---------------------------
   LOGIN
---------------------------- */

async function login(){

  const email = $('loginEmail').value.trim();
  const password = $('loginPassword').value;

  $('loginError').textContent = '';

  if(!email || !password){
    $('loginError').textContent =
      'Email aur password enter karein.';
    return;
  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    $('loginError').textContent =
      error.message;
    return;
  }

  currentUser = data.user;

  showApp();

  await load();
}


/* ---------------------------
   LOGOUT
---------------------------- */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;
  cache = [];

  $('app').style.display = 'none';
  $('loginPage').style.display = 'flex';
  $('loginPassword').value = '';
}


/* ---------------------------
   SHOW APP
---------------------------- */

function showApp(){

  $('loginPage').style.display = 'none';
  $('app').style.display = 'block';

  $('userEmail').textContent =
    currentUser?.email || '';
}


/* ---------------------------
   GET CURRENT USER
---------------------------- */

async function getUser(){

  const {data,error} =
    await supabaseClient.auth.getUser();

  if(error || !data.user){
    return null;
  }

  return data.user;
}


/* ---------------------------
   LOAD EVENTS
---------------------------- */

async function load(){

  if(!currentUser){
    currentUser = await getUser();
  }

  if(!currentUser){
    return;
  }

  $('events').innerHTML =
    '<div class="loading">Loading events...</div>';

  const {data,error} =
    await supabaseClient
      .from('weddings')
      .select('*')
      .eq('user_id',currentUser.id)
      .order('wedding_date',{
        ascending:true
      });

  if(error){

    console.error(error);

    $('events').innerHTML = `
      <div class="empty">
        <h3>Data load nahi ho saka</h3>
        <p>${esc(error.message)}</p>
      </div>
    `;

    return;
  }

  cache = (data || []).map(normalize);

  render();
}


/* ---------------------------
   EXTRA DATA
---------------------------- */

function buildNotes(){

  const extra = {
    __scheduler:true,
    time:$('time').value,
    team:$('team').value.trim(),
    venue:$('venue').value.trim(),
    package_name:$('package').value.trim(),
    notes:$('notes').value.trim()
  };

  return JSON.stringify(extra);
}


function parseExtra(notes){

  if(!notes){
    return {
      time:'',
      team:'',
      venue:'',
      package_name:'',
      notes:''
    };
  }

  try{

    const obj = JSON.parse(notes);

    if(obj && obj.__scheduler){

      return {
        time:obj.time || '',
        team:obj.team || '',
        venue:obj.venue || '',
        package_name:obj.package_name || '',
        notes:obj.notes || ''
      };

    }

  }catch(e){}

  return {
    time:'',
    team:'',
    venue:'',
    package_name:'',
    notes:notes
  };
}


/* ---------------------------
   NORMALIZE DATABASE ROW
---------------------------- */

function normalize(row){

  const extra =
    parseExtra(row.notes);

  return {

    id:row.id,

    event_date:
      row.wedding_date || '',

    event_time:
      extra.time || '',

    event_type:
      row.event_type || '',

    team:
      extra.team || '',

    venue:
      extra.venue || '',

    customer_name:
      row.client_name || '',

    customer_phone:
      row.client_number || '',

    package_name:
      extra.package_name || '',

    notes:
      extra.notes || ''

  };
}


/* ---------------------------
   RENDER
---------------------------- */

function render(){

  const search =
    $('search').value.trim().toLowerCase();

  const filter =
    $('filter').value;

  const today =
    todayString();

  let rows = cache.filter(e => {

    const text = [
      e.customer_name,
      e.customer_phone,
      e.venue,
      e.team,
      e.event_type,
      e.package_name,
      e.notes
    ]
    .join(' ')
    .toLowerCase();

    if(search && !text.includes(search)){
      return false;
    }

    if(filter === 'today'){
      return e.event_date === today;
    }

    if(filter === 'upcoming'){
      return e.event_date >= today;
    }

    if(filter === 'past'){
      return e.event_date < today;
    }

    return true;
  });


  updateStats();


  if(!rows.length){

    $('events').innerHTML = `
      <div class="empty">
        <h3>No events found</h3>
        <p>New Event button se wedding event add karein.</p>
      </div>
    `;

    return;
  }


  $('events').innerHTML =
    rows.map(e => `

      <div class="event">

        <div class="event-top">

          <div>

            <div class="event-title">
              ${esc(e.customer_name || 'Unnamed Customer')}
            </div>

            <div class="event-date">
              ${esc(formatDate(e.event_date))}
              ${e.event_time ? ' • ' + esc(e.event_time) : ''}
            </div>

          </div>

          <span class="badge">
            ${esc(e.event_type || 'Event')}
          </span>

        </div>


        <div class="event-info">

          <div>
            📞 ${esc(e.customer_phone || 'No phone')}
          </div>

          <div>
            📍 ${esc(e.venue || 'No venue')}
          </div>

          <div>
            👥 ${esc(e.team || 'No team')}
          </div>

          <div>
            📦 ${esc(e.package_name || 'No package')}
          </div>

          ${
            e.notes
            ? `<div style="grid-column:1/-1">
                📝 ${esc(e.notes)}
              </div>`
            : ''
          }

        </div>


        <div class="event-actions">

          <button
            class="btn btn-secondary"
            onclick="edit('${esc(e.id)}')">
            Edit
          </button>

          <button
            class="btn btn-danger"
            onclick="del('${esc(e.id)}')">
            Delete
          </button>

        </div>

      </div>

    `).join('');
}


/* ---------------------------
   STATS
---------------------------- */

function updateStats(){

  const today =
    todayString();

  const total =
    cache.length;

  const upcoming =
    cache.filter(e =>
      e.event_date >= today
    ).length;

  const todayCount =
    cache.filter(e =>
      e.event_date === today
    ).length;

  $('totalCount').textContent =
    total;

  $('upcomingCount').textContent =
    upcoming;

  $('todayCount').textContent =
    todayCount;
}


/* ---------------------------
   OPEN MODAL
---------------------------- */

function openModal(){

  $('editId').value = '';

  $('modalTitle').textContent =
    'New Wedding Event';

  $('date').value = '';
  $('time').value = '';
  $('type').value = '';
  $('team').value = '';
  $('venue').value = '';
  $('customer').value = '';
  $('phone').value = '';
  $('package').value = '';
  $('notes').value = '';

  $('modal').style.display = 'block';
}


/* ---------------------------
   CLOSE MODAL
---------------------------- */

function closeModal(){

  $('modal').style.display =
    'none';
}


/* ---------------------------
   EDIT
---------------------------- */

function edit(id){

  const e =
    cache.find(x => String(x.id) === String(id));

  if(!e){
    return;
  }

  $('editId').value =
    e.id;

  $('modalTitle').textContent =
    'Edit Wedding Event';

  $('date').value =
    e.event_date || '';

  $('time').value =
    e.event_time || '';

  $('type').value =
    e.event_type || '';

  $('team').value =
    e.team || '';

  $('venue').value =
    e.venue || '';

  $('customer').value =
    e.customer_name || '';

  $('phone').value =
    e.customer_phone || '';

  $('package').value =
    e.package_name || '';

  $('notes').value =
    e.notes || '';

  $('modal').style.display =
    'block';
}


/* ---------------------------
   SAVE
---------------------------- */

async function save(){

  if(!currentUser){
    alert('Please login first.');
    return;
  }

  const date =
    $('date').value;

  const type =
    $('type').value;

  const customer =
    $('customer').value.trim();

  if(!date){
    alert('Wedding Date enter karein.');
    return;
  }

  if(!type){
    alert('Event Type select karein.');
    return;
  }

  if(!customer){
    alert('Customer Name enter karein.');
    return;
  }


  const record = {

    wedding_date:date,

    client_name:customer,

    client_number:
      $('phone').value.trim(),

    event_type:type,

    notes:buildNotes(),

    user_id:currentUser.id

  };


  const editId =
    $('editId').value;


  let result;


  if(editId){

    result =
      await supabaseClient
        .from('weddings')
        .update(record)
        .eq('id',editId)
        .eq('user_id',currentUser.id);

  }else{

    result =
      await supabaseClient
        .from('weddings')
        .insert(record);

  }


  if(result.error){

    console.error(result.error);

    alert(
      'Save nahi hua:\n' +
      result.error.message
    );

    return;
  }


  closeModal();

  await load();

}


/* ---------------------------
   DELETE
---------------------------- */

async function del(id){

  if(!currentUser){
    return;
  }

  const ok =
    confirm(
      'Kya aap is event ko delete karna chahte hain?'
    );

  if(!ok){
    return;
  }


  const {error} =
    await supabaseClient
      .from('weddings')
      .delete()
      .eq('id',id)
      .eq('user_id',currentUser.id);


  if(error){

    console.error(error);

    alert(
      'Delete nahi hua:\n' +
      error.message
    );

    return;
  }


  await load();
}


/* ---------------------------
   AUTH STATE
---------------------------- */

supabaseClient.auth.onAuthStateChange(
  async (event,session) => {

    if(event === 'SIGNED_OUT'){

      currentUser = null;
      cache = [];

      $('app').style.display =
        'none';

      $('loginPage').style.display =
        'flex';

    }

  }
);


/* ---------------------------
   BOOT
---------------------------- */

async function boot(){

  currentUser =
    await getUser();

  if(currentUser){

    showApp();

    await load();

  }else{

    $('loginPage').style.display =
      'flex';

    $('app').style.display =
      'none';

  }
}


boot();

</script>

</body>
</html>
