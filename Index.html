<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naveed Wedding Photographer Team— Schedule</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Nastaliq Urdu",sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#172033,#384765)}
.card{background:white;border-radius:22px;box-shadow:0 12px 40px #0002}
.login .card{width:min(420px,100%);padding:28px}
.brand{font-weight:800;font-size:25px}
.muted{color:#718096}
.field{margin:12px 0}
.field label{display:block;font-size:13px;margin-bottom:6px;color:#64748b}
input,select,textarea{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:12px;background:#fff;outline:none}
textarea{min-height:80px;resize:vertical}
.btn{padding:11px 15px;border-radius:12px;font-weight:700}
.primary{background:#172033;color:#fff}
.light{background:#eef2f7;color:#172033}
.danger{background:#fee2e2;color:#991b1b}
.app{max-width:1100px;margin:auto;padding:14px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:16px}
.stat b{font-size:28px;display:block}
.toolbar{display:grid;grid-template-columns:1.4fr .8fr auto;gap:8px;margin:12px 0}
.events{display:grid;gap:10px}
.day{padding:14px}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.daydate{font-weight:800}
.count{background:#eef2ff;border-radius:20px;padding:5px 10px;font-size:12px}
.event{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:13px 0;border-top:1px solid #edf0f5;align-items:center}
.time{font-weight:800}
.type{display:inline-block;padding:4px 8px;border-radius:8px;background:#f1f5f9;font-size:12px;margin-bottom:5px}
.venue{font-weight:750}
.meta{font-size:13px;color:#64748b}
.actions{display:flex;gap:6px}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px}
.modal .card{width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
.formactions{display:flex;gap:8px;justify-content:flex-start;margin-top:12px}
.err{color:#b91c1c;font-size:13px;min-height:20px}
@media(max-width:650px){
.stats{grid-template-columns:repeat(3,1fr)}
.toolbar{grid-template-columns:1fr 1fr}
.toolbar .add{grid-column:1/-1}
.event{grid-template-columns:70px 1fr}
.actions{grid-column:2}
.formgrid{grid-template-columns:1fr}
.full{grid-column:auto}
}
</style>

<!-- Supabase CDN Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

</head>

<body>

<div id="login" class="login">
<div class="card">
<div class="brand">Hafiz Wedding Equipment</div>
<p class="muted">Shared Wedding Schedule</p>

<div class="field">
<label>Login ID (Email)</label>
<input id="username" value="admin@example.com">
</div>

<div class="field">
<label>Password</label>
<input id="password" type="password" value="123456">
</div>

<div id="loginErr" class="err"></div>

<button class="btn primary" style="width:100%" onclick="login()">Login</button>
</div>
</div>

<div id="app" class="app hidden">

<div class="top">
<div>
<div class="brand">Hafiz Wedding Equipment</div>
<div class="muted">Team Schedule</div>
</div>

<button class="btn light" onclick="logout()">Logout</button>
</div>

<div class="stats">
<div class="card stat">
<span class="muted">Total Events</span>
<b id="sTotal">0</b>
</div>

<div class="card stat">
<span class="muted">Dates</span>
<b id="sDates">0</b>
</div>

<div class="card stat">
<span class="muted">Today</span>
<b id="sToday">0</b>
</div>
</div>

<div class="toolbar">
<input id="search" placeholder="Search venue, team, customer..." oninput="load()">

<select id="filter" onchange="load()">
<option value="">All Events</option>
<option>Mehndi</option>
<option>Baraat</option>
<option>Walima</option>
<option>Nikah</option>
<option>Other</option>
</select>

<button class="btn primary add" onclick="openForm()">+ New Event</button>
</div>

<div id="events" class="events"></div>

</div>

<div id="modal" class="modal hidden">
<div class="card">
<div class="top">
<h2 id="formTitle">New Event</h2>
<button class="btn light" onclick="closeForm()">×</button>
</div>

<input type="hidden" id="eid">

<div class="formgrid">
<div class="field">
<label>Date</label>
<input id="date" type="date">
</div>

<div class="field">
<label>Time</label>
<input id="time" type="time">
</div>

<div class="field">
<label>Event Type</label>
<select id="type">
<option>Mehndi</option>
<option>Baraat</option>
<option>Walima</option>
<option>Nikah</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label>Assigned Team</label>
<select id="team">
<option value="Digital Light Team">Digital Light Team</option>
<option value="Web Team">Web Team</option>
<option value="Naveed Photographer Team">Naveed Photographer Team</option>
<option value="Videography Team">Videography Team</option>
<option value="Sound Team">Sound Team</option>
<option value="LED Team">LED Team</option>
<option value="Decoration Team">Decoration Team</option>
<option value="Event Management Team">Event Management Team</option>
</select>
</div>

<div class="field full">
<label>Venue</label>
<input id="venue">
</div>

<div class="field">
<label>Customer Name</label>
<input id="customer">
</div>

<div class="field">
<label>Customer Phone</label>
<input id="phone">
</div>

<div class="field full">
<label>Package</label>
<input id="package">
</div>

<div class="field full">
<label>Notes</label>
<textarea id="notes"></textarea>
</div>
</div>

<div id="formErr" class="err"></div>

<div class="formactions">
<button class="btn primary" onclick="save()">Save Event</button>
<button class="btn light" onclick="closeForm()">Cancel</button>
</div>
</div>
</div>

<script>
let cache = [];
const $ = id => document.getElementById(id);

// Supabase Client Initialization
let supabaseClient;
if (window.supabase) {
    supabaseClient = window.supabase.createClient(
        typeof SUPABASE_URL !== 'undefined' ? SUPABASE_URL : '',
        typeof SUPABASE_ANON_KEY !== 'undefined' ? SUPABASE_ANON_KEY : ''
    );
}

async function api(url, opt = {}) {
    const r = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...opt
    });

    if (r.status === 401) {
        showLogin();
        throw new Error("Unauthorized");
    }

    const d = await r.json();
    if (!r.ok) throw Error(d.error || 'Error');
    return d;
}

function showLogin() {
    $('login').classList.remove('hidden');$('app').classList.add('hidden');
}

async function login() {
    try {
        // Supabase Login Option
        if (supabaseClient) {
            const { error } = await supabaseClient.auth.signInWithPassword({
                email: $('username').value,
                password: $('password').value
            });
            if (error) throw error;
        } else {
            // Standard API Login Fallback
            await api('/api/login', {
                method: 'POST',
                body: JSON.stringify({
                    username: $('username').value,
                    password: $('password').value
                })
            });
        }

        $('login').classList.add('hidden');$('app').classList.remove('hidden');

        load();
        stats();
    } catch (e) {
        $('loginErr').textContent = e.message;
    }
}

async function logout() {
    if (supabaseClient) {
        await supabaseClient.auth.signOut();
    } else {
        await api('/api/logout', { method: 'POST' });
    }
    showLogin();
}

async function stats() {
    try {
        const s = await api('/api/stats');
        $('sTotal').textContent = s.total;
        $('sDates').textContent = s.dates;
        $('sToday').textContent = s.today;
    } catch(e) {
        console.error(e);
    }
}

async function load() {
    try {
        const q = encodeURIComponent($('search').value);
        const t = encodeURIComponent($('filter').value);
        cache = await api('/api/events?q=' + q + '&type=' + t);
        render();
    } catch(e) {
        console.error(e);
    }
}

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    }[m]));
}

function render() {
    const groups = {};
    cache.forEach(e => (groups[e.event_date] ??= []).push(e));

    $('events').innerHTML = Object.entries(groups).map(([date, es]) => `
        <div class="card day">
            <div class="dayhead">
                <div class="daydate">
                    ${esc(new Date(date + 'T00:00:00').toLocaleDateString('en-GB', {
                        weekday: 'long', day: '2-digit', month: 'short', year: 'numeric'
                    }))}
                </div>
                <div class="count">${es.length} events</div>
            </div>
            ${es.map(e => `
                <div class="event">
                    <div class="time">${esc(e.event_time)}</div>
                    <div>
                        <span class="type">${esc(e.event_type)}</span>
                        <div class="venue">${esc(e.venue)}</div>
                        <div class="meta">
                            Team: ${esc(e.team)}${e.customer_name ? ' • ' + esc(e.customer_name) : ''}
                            ${e.package_name ? ' • ' + esc(e.package_name) : ''}
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn light" onclick="edit(${e.id})">Edit</button>
                        <button class="btn danger" onclick="del(${e.id})">Delete</button>
                    </div>
                </div>
            `).join('')}
        </div>
    `).join('') || '<div class="card" style="padding:25px;text-align:center">No events found</div>';
}

function openForm(e) {
    $('modal').classList.remove('hidden');$('formTitle').textContent = e ? 'Edit Event' : 'New Event';
    $('eid').value = e?.id || '';
    $('date').value = e?.event_date \vert{}\vert{} new Date().toISOString().slice(0, 10);$('time').value = e?.event_time || '';
    $('type').value = e?.event_type \vert{}\vert{} 'Mehndi';$('team').value = e?.team || 'Digital Light Team';
    $('venue').value = e?.venue \vert{}\vert{} '';$('customer').value = e?.customer_name || '';
    $('phone').value = e?.customer_phone \vert{}\vert{} '';$('package').value = e?.package_name || '';
    $('notes').value = e?.notes \vert{}\vert{} '';$('formErr').textContent = '';
}

function closeForm() {
    $('modal').classList.add('hidden');
}

function edit(id) {
    openForm(cache.find(x => x.id === id));
}

async function save() {
    const e = {
        event_date: $('date').value,
        event_time: $('time').value,
        event_type: $('type').value,
        team: $('team').value,
        venue: $('venue').value,
        customer_name: $('customer').value,
        customer_phone: $('phone').value,
        package_name: $('package').value,
        notes: $('notes').value
    };

    try {
        const id = $('eid').value;
        await api(id ? '/api/events/' + id : '/api/events', {
            method: id ? 'PUT' : 'POST',
            body: JSON.stringify(e)
        });
        closeForm();
        await load();
        stats();
    } catch (x) {
        $('formErr').textContent = x.message;
    }
}

async function del(id) {
    if (!confirm('Delete this event?')) return;
    await api('/api/events/' + id, { method: 'DELETE' });
    load();
    stats();
}
</script>

</body>
                                                         </html>
