<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naveed Wedding Photographer Team - Wedding Scheduler</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f4f6f9;
      color:#222
    }
    .container{
      max-width:1100px;
      margin:auto;
      padding:20px
    }
    .header{
      background:#111827;
      color:white;
      padding:18px 20px;
      border-radius:14px;
      margin-bottom:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px
    }
    .header h1{margin:0;font-size:22px}
    button{
      border:0;
      border-radius:8px;
      padding:10px 16px;
      cursor:pointer;
      font-weight:bold
    }
    .logout{background:#dc2626;color:white}
    .card{
      background:white;
      border-radius:14px;
      padding:20px;
      margin-bottom:20px;
      box-shadow:0 2px 10px #00000012
    }
    .login{
      max-width:420px;
      margin:70px auto
    }
    input,select,textarea{
      width:100%;
      padding:12px;
      margin:7px 0 12px;
      border:1px solid #ddd;
      border-radius:8px;
      font-size:15px
    }
    textarea{min-height:90px}
    .primary{
      background:#111827;
      color:white;
      width:100%
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px
    }
    .stat{
      padding:18px;
      border-radius:12px;
      background:#f1f5f9;
      text-align:center
    }
    .stat strong{
      display:block;
      font-size:25px;
      margin-top:5px
    }
    .filters{
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:10px
    }
    .event{
      border:1px solid #e5e7eb;
      border-radius:12px;
      padding:15px;
      margin-top:12px
    }
    .event h3{margin:0 0 8px}
    .event p{margin:6px 0}
    .actions{margin-top:12px;display:flex;gap:8px}
    .edit{background:#2563eb;color:white}
    .delete{background:#dc2626;color:white}
    .hidden{display:none!important}
    .msg{
      padding:10px;
      border-radius:8px;
      margin-bottom:10px;
      background:#fee2e2;
      color:#991b1b
    }
    @media(max-width:700px){
      .grid{grid-template-columns:repeat(2,1fr)}
      .filters{grid-template-columns:1fr}
      .header{align-items:flex-start;flex-direction:column}
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container">
  <div class="card login">
    <h2>Wedding Scheduler</h2>
    <p>Naveed Wedding Photographer Team</p>

    <div id="loginMsg" class="msg hidden"></div>

    <label>Email</label>
    <input id="email" type="email" placeholder="Admin email">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">
